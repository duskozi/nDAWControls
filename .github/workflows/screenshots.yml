name: Screenshots

# Renders every gallery catalog entry and both gallery views in every skin (images for the website).
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'samples/Gallery/**'
      - 'src/nDAWControls/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write   # the images are pushed to the screenshots branch

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the gallery
        run: dotnet publish samples/Gallery/nDAWControls.Gallery.csproj -c Release -r win-x64 --self-contained false -o gallery

      - name: Render
        shell: pwsh
        run: |
          $p = Start-Process -FilePath gallery/nDAWControls.Gallery.exe -ArgumentList '--screenshots', "$PWD/screenshots" -Wait -PassThru
          Get-Content screenshots/log.txt
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots

      # The images also go to the 'screenshots' branch (one commit, replaced each run), where the website takes them.
      - name: Push to the screenshots branch
        shell: pwsh
        run: |
          Remove-Item screenshots/log.txt -ErrorAction SilentlyContinue
          cd screenshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
